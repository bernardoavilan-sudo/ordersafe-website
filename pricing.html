<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OrderSafe Pricing</title>
    <style>
        body { background-color: #0b0f19; color: #ffffff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 50px; }
        h1 { color: #00ffcc; margin-bottom: 50px; }
        .pricing-container { display: flex; justify-content: center; gap: 30px; }
        .plan { background: #111827; border: 1px solid #2d3748; padding: 40px; border-radius: 10px; width: 300px; }
        .plan.pro { border-color: #00ffcc; box-shadow: 0 0 20px rgba(0, 255, 204, 0.1); }
        .price { font-size: 48px; font-weight: bold; margin: 20px 0; }
        .btn { display: inline-block; background: #00ffcc; color: #0b0f19; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px; }
        ul { list-style: none; padding: 0; color: #a0aec0; text-align: left; margin-bottom: 30px; }
        li { margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Simple, Transparent Pricing</h1>
    <div class="pricing-container">
        <div class="plan">
            <h2>Starter</h2>
            <div class="price">$99<span style="font-size:16px; color:#a0aec0;">/mo</span></div>
            <ul>
                <li>✓ 500 Transactions/month</li>
                <li>✓ Real-Time AI Analysis</li>
                <li>✓ Email Support</li>
            </ul>
            <a href="mailto:contact@ordersafeai.com?subject=Starter Plan" class="btn">Get Started</a>
        </div>
        <div class="plan pro">
            <h2>Pro</h2>
            <div class="price">$249<span style="font-size:16px; color:#a0aec0;">/mo</span></div>
            <ul>
                <li>✓ 5,000 Transactions/month</li>
                <li>✓ Advanced Fraud Rules</li>
                <li>✓ Priority Support</li>
                <li>✓ Custom Integrations</li>
            </ul>
            <a href="mailto:contact@ordersafeai.com?subject=Pro Plan" class="btn">Get Started</a>
        </div>
    </div>
    <br><br>
    <a href="index.html" style="color: #00ffcc; text-decoration: none;">← Back to Home</a>
</body>
</html>
